name: Build and Release LiveStrike

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_PATH: 'OverlayWindow.csproj'
  APP_NAME: 'LiveStrike'

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'server/package.json'
        
    - name: Install Node dependencies
      run: |
        cd server
        npm ci
        
    - name: Restore .NET dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}
      
    - name: Build application
      run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore
      
    - name: Run tests (if any)
      run: dotnet test ${{ env.PROJECT_PATH }} --configuration Release --no-build --verbosity normal
      continue-on-error: true
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          bin/Release/
          server/
        retention-days: 5

  publish-releases:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: windows-latest
    
    strategy:
      matrix:
        runtime: [win-x64, win-x86, win-arm64]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'server/package.json'
        
    - name: Install Node dependencies
      run: |
        cd server
        npm ci --production
        
    - name: Publish self-contained executable
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} `
          --configuration Release `
          --runtime ${{ matrix.runtime }} `
          --self-contained true `
          --output "publish/${{ matrix.runtime }}" `
          -p:PublishSingleFile=true `
          -p:PublishReadyToRun=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true
          
    - name: Create portable zip
      run: |
        Compress-Archive -Path "publish/${{ matrix.runtime }}/*" -DestinationPath "${{ env.APP_NAME }}-${{ github.ref_name }}-${{ matrix.runtime }}.zip"
        
    - name: Create installer (Windows x64 only)
      if: matrix.runtime == 'win-x64'
      run: |
        # Install advanced installer or use WiX
        # For now, create a simple batch installer
        $installerContent = @"
        @echo off
        echo Installing CS2 Overlay...
        set INSTALL_DIR=%ProgramFiles%\CS2Overlay
        if not exist "%INSTALL_DIR%" mkdir "%INSTALL_DIR%"
        copy /Y "LiveStrike.exe" "%INSTALL_DIR%\"
        copy /Y /S "server\*" "%INSTALL_DIR%\server\"
        echo Creating desktop shortcut...
        powershell -Command "
        `$WshShell = New-Object -comObject WScript.Shell;
        `$Shortcut = `$WshShell.CreateShortcut('%USERPROFILE%\Desktop\LiveStrike.lnk');
        `$Shortcut.TargetPath = '%INSTALL_DIR%\LiveStrike.exe';
        `$Shortcut.WorkingDirectory = '%INSTALL_DIR%';
        `$Shortcut.Description = 'LiveStrike - CS2 match tracking widget';
        `$Shortcut.Save()
        "
        echo Installation complete!
        pause
        "@
        Set-Content -Path "publish/${{ matrix.runtime }}/install.bat" -Value $installerContent
        
        # Create uninstaller
        $uninstallerContent = @"
        @echo off
        echo Uninstalling LiveStrike...
        set INSTALL_DIR=%ProgramFiles%\CS2Overlay
        if exist "%INSTALL_DIR%" rmdir /S /Q "%INSTALL_DIR%"
        if exist "%USERPROFILE%\Desktop\LiveStrike.lnk" del "%USERPROFILE%\Desktop\LiveStrike.lnk"
        echo Uninstallation complete!
        pause
        "@
        Set-Content -Path "publish/${{ matrix.runtime }}/uninstall.bat" -Value $uninstallerContent
        
    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.runtime }}
        path: |
          ${{ env.APP_NAME }}-${{ github.ref_name }}-${{ matrix.runtime }}.zip
          publish/${{ matrix.runtime }}/install.bat
          publish/${{ matrix.runtime }}/uninstall.bat
        retention-days: 30

  create-github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-releases
    runs-on: windows-latest
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        draft: false
        prerelease: contains(github.ref, '-')
        generate_release_notes: true
        files: |
          **/*.zip
          **/install.bat
          **/uninstall.bat
        body: |
          ## LiveStrike ${{ github.ref_name }}
          
          ### � What's New
          - Modern CS2 match tracking widget for real-time score monitoring
          - Real-time data fetched from HLTV with auto-start Node.js server
          - Clean sidebar design that won't disrupt your gameplay
          - Customizable transparency, animations, and positioning
          - System tray integration with settings menu
          - User-friendly Node.js setup guidance
          
          ### 📦 Downloads
          - **Windows x64**: Recommended for most users (79MB)
          - **Windows x86**: For 32-bit systems (72MB)  
          - **Windows ARM64**: For ARM-based Windows devices
          
          ### 🚀 Quick Start
          1. Download the appropriate ZIP file for your system
          2. Extract and run `LiveStrike.exe` - that's it!
          3. If prompted for Node.js: Click "Yes" to install for live data
          4. Select matches from the picker and start tracking
          
          ### 📋 System Requirements
          - Windows 10/11 (x64, x86, ARM64)
          - No .NET runtime required (self-contained)
          - ~50MB RAM usage
          - Internet connection for live data
          - Node.js (auto-guided setup if missing)
          
          ### 🔧 Features
          - Live scores and round updates from HLTV
          - Configurable polling intervals and transparency
          - Global hotkeys for quick control
          - Professional error handling and logging
          - Zero-configuration auto-start
          
          ### 🐛 Issues & Support
          Report bugs and feature requests on [GitHub Issues](../../issues)
          Check troubleshooting guide in [README](../../blob/main/README.md)
      env:
        GITHUB_TOKEN: ${{ github.token }}