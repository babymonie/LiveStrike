name: Publish and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore Hltv.sln

      - name: Build solution
        run: dotnet build Hltv.sln --configuration Release --no-restore

      - name: Publish app
        run: dotnet publish OverlayWindow.csproj `
              --configuration Release `
              --output ./publish `
              --runtime win-x64 `
              --self-contained true

      - name: Organize release folder
        run: |
          mkdir release
          mkdir release/server
          Copy-Item publish\LiveStrike.exe release\
          if (Test-Path publish\LiveStrike.pdb) { Copy-Item publish\LiveStrike.pdb release\ }

          # Copy entire Node server folder from publish output
          if (Test-Path publish\server) { Copy-Item publish\server\* release\server\ -Recurse -Force }

      - name: Create ZIP archive
        run: powershell Compress-Archive -Path release\* -DestinationPath release.zip

      - name: Upload release.zip
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: release.zip

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download built zip
        uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: ./

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
